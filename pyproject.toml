[project]
name = "rag-taxation-rk"
version = "0.1.0"
description = "Hybrid RAG API for the Tax Code of Kazakhstan"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "qdrant-client>=1.14,<2",
    "fastembed>=0.7,<1",
    "rank-bm25>=0.2.2,<1",
    "numpy>=1.26,<3",
    "tqdm>=4.66,<5",
]

[tool.vercel]
entrypoint = "src.api:app"
